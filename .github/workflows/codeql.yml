---
name: 🛡️ CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: 🖥️ Run CodeQL
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: ['actions', 'javascript', 'python']

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: 📐 Initialize CodeQL
        uses: github/codeql-action/init@5e7a52feb2a3dfb87f88be2af33b9e2275f48de6
        with:
          languages: ${{ matrix.language }}

      - name: 👷🏾‍♂️ Autobuild
        uses: github/codeql-action/autobuild@5e7a52feb2a3dfb87f88be2af33b9e2275f48de6

      - name: 📠 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5e7a52feb2a3dfb87f88be2af33b9e2275f48de6
        with:
          category: 'Security'
